name: HTML to APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create PWABuilder project
        run: |
          # PWA template ကိုသုံးမယ်
          npx @pwabuilder/cli create --name "MC Addon Merger" --package com.mcmerger.app
          cd my-pwa
          cp ../index.html www/
          
      - name: Build APK with Bubblewrap
        run: |
          cd my-pwa
          npm install
          npx bubblewrap init --manifest https://yourusername.github.io/reponame/manifest.json
          npx bubblewrap build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mc-merger-apk
          path: my-pwa/android/app/build/outputs/apk/debug/*.apk

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MC Addon Merger - Java Connected</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
:root{
  --gold:#FFD700;--diamond:#5DECF5;--emerald:#17DD62;
  --red:#FF5555;--orange:#FFAA00;--purple:#CC88FF;
  --bg:#0d0d0d;--panel:#1e1e1e;--dim:#777;--text:#F0F0F0;
  --font:'Press Start 2P',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:10px;min-height:100vh;padding:20px;}
.container{max-width:800px;margin:0 auto;background:var(--panel);border:4px solid #444;padding:20px;border-radius:10px;}
h1{color:var(--gold);text-align:center;margin-bottom:20px;font-size:16px;}
.form-group{margin-bottom:15px;}
label{display:block;margin-bottom:5px;color:var(--diamond);}
input[type="text"], input[type="file"]{width:100%;padding:10px;background:#111;border:2px solid #555;color:#fff;font-family:var(--font);font-size:10px;}
button{width:100%;padding:15px;background:var(--emerald);border:none;color:#000;font-family:var(--font);font-size:12px;cursor:pointer;font-weight:bold;margin-top:10px;}
button:disabled{background:#555;cursor:not-allowed;}
#logBox{background:#000;border:2px solid #333;padding:10px;height:15px;overflow-y:auto;margin-top:15px;display:none;}
#logBox.on{display:block;}
.ll{margin-bottom:5px;line-height:1.4;}
.ll.info{color:var(--diamond)}
.ll.ok{color:var(--emerald)}
.ll.err{color:var(--red)}
#pw{display:none;margin-top:10px;color:var(--orange);}
#pw.on{display:block;}
</style>
</head>
<body>

<div class="container">
  <h1>MINECRAFT ADDON MERGER (JAVA SERVER CONTEXT)</h1>
  
  <div class="form-group">
    <label>Select Addon Files (.mcaddon or .zip):</label>
    <input type="file" id="fi" multiple accept=".zip,.mcaddon">
  </div>

  <div class="form-group">
    <label>Unified Behavior Pack Name:</label>
    <input type="text" id="bpName" value="Unified_BP">
  </div>

  <div class="form-group">
    <label>Unified Resource Pack Name:</label>
    <input type="text" id="rpName" value="Unified_RP">
  </div>

  <div class="form-group">
    <label>Output File Name:</label>
    <input type="text" id="outName" value="Merged_Addon">
  </div>

  <button id="btnMerge" onclick="startMerge()">MERGE ON JAVA BACKEND</button>
  
  <div id="pw">Processing... Please wait...</div>
  <div id="logBox"></div>
</div>

<script>
function v(id, def){ const e=document.getElementById(id); return (e && e.value.trim()) ? e.value.trim() : def; }

async function startMerge() {
  const filesInput = document.getElementById('fi').files;
  if (!filesInput.length) { alert('Please select files first!'); return; }
  
  document.getElementById('btnMerge').disabled = true;
  document.getElementById('logBox').innerHTML = '';
  document.getElementById('logBox').classList.add('on');
  document.getElementById('pw').classList.add('on');

  addLog('info', 'SYS', 'Connecting to secure Java Backend...');
  addLog('info', 'SYS', 'Uploading large files chunks into the Database & Server stream...');

  const formData = new FormData();
  for (let i = 0; i < filesInput.length; i++) {
      formData.append('files', filesInput[i]);
  }
  formData.append('bpName', v('bpName', 'Unified_BP'));
  formData.append('rpName', v('rpName', 'Unified_RP'));

  try {
    // Java Spring Boot API Context Url
    const response = await fetch('http://localhost:8080/api/addons/merge', {
        method: 'POST',
        body: formData
    });

    if (!response.ok) throw new Error('Backend failed to process or authorization denied.');

    addLog('info', 'SYS', 'Server merging and DB writing completed. Fetching final package...');
    
    const blob = await response.blob();
    const outName = v('outName', 'Merged_Addon');
    
    saveAs(blob, `${outName}.mcaddon`);
    
    const mb = (blob.size / 1024 / 1024).toFixed(2);
    addLog('ok', '✓', `Success! Saved to DB & Merged. Size: ${mb} MB`);
    document.getElementById('pw').innerText = '✓ Merge Completed!';

  } catch (error) {
    addLog('err', 'ERR', `Failed: ${error.message}`);
    document.getElementById('pw').innerText = '✕ Processing Error';
  } finally {
    document.getElementById('btnMerge').disabled = false;
  }
}

function addLog(type, tag, msg){
  const b=document.getElementById('logBox');
  const d=document.createElement('div');
  d.className='ll '+type;
  d.innerText=`[${tag}] ${msg}`;
  b.appendChild(d);
  b.scrollTop=b.scrollHeight;
}
</script>
</body>
</html>
